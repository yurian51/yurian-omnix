lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    dependencies: {}
  apps/api:
    dependencies: {}
  apps/worker:
    dependencies:
      '@omnix/database':
        specifier: workspace:*
        version: link:../../packages/database
      '@omnix/queue':
        specifier: workspace:*
        version: link:../../packages/queue
      bullmq:
        specifier: ^5.58.5
        version: 5.58.5
  packages/database:
    dependencies:
      '@prisma/client':
        specifier: ^6.15.0
        version: 6.15.0(prisma@6.15.0)
    devDependencies:
      prisma:
        specifier: ^6.15.0
        version: 6.15.0
  packages/queue:
    dependencies:
      bullmq:
        specifier: ^5.58.5
        version: 5.58.5
      ioredis:
        specifier: ^5.7.0
        version: 5.7.0
  packages/auth:
    dependencies:
      '@omnix/database':
        specifier: workspace:*
        version: link:../database

packages: {}

snapshots: {}
